[package]
name = "soulseek-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Derives schemars::JsonSchema on public types so soulseek-mcp can expose
# them in MCP tool schemas without a separate wrapper layer.
schemars = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
lofty = "0.24"
fingerprint-core = { path = "../fingerprint-core" }
schemars = { version = "1", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "rt-multi-thread"] }
hound = "3"
