[package]
name = "crate-agent-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "crate_agent_core"
# staticlib: linkable into the Swift app via XCFramework / direct static lib
# rlib: enables Rust-side unit tests
crate-type = ["staticlib", "rlib"]

[dependencies]
# FFI surface — uniffi generates Swift bindings from crate-agent-core.udl
uniffi = { version = "0.28", features = ["cli"] }

# Serialization for FFI payload types and event-log inverse payloads
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error types
thiserror = "1"

# --- Domain dependencies ---
# Added incrementally as their respective modules are implemented.
#
# Serato `.crate` reader/writer is implemented in-house (rust-core/src/
# serato.rs) — see CLAUDE.md for the AGPL-avoidance rationale.

# Audio fingerprinting (foundation, day 1 — Approach 3 in the design).
# Pure Rust, MIT-declared via Cargo.toml (note: upstream repo at
# github.com/darksv/rusty-chromaprint lacks a LICENSE file at time of
# adoption; we rely on the crates.io declaration).
rusty-chromaprint = "0.3"

# Audio decoder feeding chromaprint. MPL-2.0 — file-level copyleft,
# fine for library use without modification. Default features include
# MP3, FLAC, WAV, Vorbis; extra features pick up the rest of Serato's
# supported set.
symphonia = { version = "0.6", features = ["mp3", "aac", "alac", "isomp4", "aiff"] }

# Tag I/O (read in SP-1, write in SP-1.5) — added when the tags module
# is implemented.
# lofty = "..."

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
# Test utilities go here as tests are written
