[workspace]
# soulseek-core and soulseek-mcp are added by their respective tasks.
members = ["fingerprint-core", "soulseek-core", "soulseek-mcp"]
resolver = "2"

[package]
name = "crate-agent-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "crate_agent_core"
# staticlib: linkable into the Swift app via XCFramework / direct static lib
# rlib: enables Rust-side unit tests
crate-type = ["staticlib", "rlib"]

[dependencies]
# FFI surface — uniffi generates Swift bindings from crate-agent-core.udl
uniffi = { version = "0.28", features = ["cli"] }

# Serialization for FFI payload types and event-log inverse payloads
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error types
thiserror = "1"

# --- Domain dependencies ---
# Added incrementally as their respective modules are implemented.
#
# Serato `.crate` reader/writer is implemented in-house (rust-core/src/
# serato.rs) — see CLAUDE.md for the AGPL-avoidance rationale.

# Audio fingerprinting — implementation lives in the shared fingerprint-core
# crate so soulseek-core can use it too without duplication.
fingerprint-core = { path = "fingerprint-core" }

# Tag I/O (read in SP-1, write in SP-1.5). MIT/Apache-2.0, supports
# MP3 (ID3v2), M4A/MP4 (iTunes atoms), FLAC/OGG (Vorbis comments),
# WAV (RIFF INFO + ID3), AIFF (ID3) — covers every format Serato
# accepts. Unified Accessor API across formats.
lofty = "0.24"

# Serato stores cue and beatgrid analysis as base64 inside audio tags.
base64 = "0.23"

# Same-directory temporary files for atomic Serato library rewrites (#193).
tempfile = "3.27"

# NFC path comparison, matching Swift's `SeratoPath.normalized` (#179).
unicode-normalization = "0.1.26"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
# Test utilities go here as tests are written
